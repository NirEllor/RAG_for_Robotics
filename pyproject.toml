[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "action_retrieval"
version = "0.1.0"
description = "Action-Aware 3D Retrieval for Robotic Manipulation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Nir Ellor", email = "nirellorwaizner@gmail.com"}
]

dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.21",
    "torch>=2.0",
    "pandas>=1.3",
    "pyarrow>=10.0",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
    "Pillow>=8.0",
    "pytest>=6.2",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
]
faiss = [
    "faiss-cpu>=1.7",
]
viz = [
    "open3d>=0.13",
]
3d = [
    "open3d>=0.13",
]

[project.urls]
Repository = "https://github.com/NirEllor/RAG_for_Robotics"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["action_retrieval*"]

[tool.setuptools.package-data]
action_retrieval = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
