name: uni3d
type: 3d_foundation
status: READY_FOR_MVP_PROXY

# Uni3D-style foundation model for 3D scene understanding.
# The repository currently ships a deterministic, CPU-friendly proxy encoder
# that preserves the retrieval interface. It can be swapped for a real Uni3D
# checkpoint/loader on the cluster without changing downstream code.

model_size: small  # Options: small, medium, large (CPU-only, prefer small)
checkpoint: null   # Set to a real checkpoint once available
pretrained: true
frozen: true
output_dim: 768

note: "Use the retrieval pipeline's uni3d encoder path; replace with a real Uni3D checkpoint later."
