name: ptv3
type: 3d_foundation
status: REAL_BACKEND_READY

# Point Transformer V3-style backbone.
# The retrieval pipeline now supports two modes:
#   1. real PTv3 loading when PTV3_REPO_ROOT + PTV3_CHECKPOINT are set
#   2. deterministic proxy fallback when the real backend is unavailable
#
# To enable the real model on the cluster, point PTV3_REPO_ROOT at the cloned
# PTv3/Pointcept codebase that matches Pointcept v1.5.2, set
# PTV3_REPO_LAYOUT=pointcept, and point PTV3_CHECKPOINT at a checkpoint from
# the same release family.
#
# The loader validates the repository tag/commit by default so we do not
# accidentally mix code from one PTv3 release with weights from another.

model_size: small
checkpoint: null
pretrained: true
frozen: true
output_dim: 768

note: "Use the retrieval pipeline's ptv3 encoder path; set env vars to activate the real PTv3 checkpoint. Prefer Pointcept v1.5.2-compatible code and weights."
