# @package _global_

# Smoke test experiment: minimal setup to verify environment.
# Generates one ReachTarget episode, saves observations, and tests the pipeline.

experiment:
  name: smoke_test
  seed: 42
  output_root: outputs/smoke

dataset:
  name: rlbench_reach_target
  num_episodes: 1
  episode_seeds: [42]

encoder:
  name: random

retrieval:
  k: 1

runtime:
  num_workers: 1
  log_level: INFO
